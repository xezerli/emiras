# Giriş nöqtəsi: /v1 və /hubs Gateway-ə, qalanı Next.js-ə. TLS bu qatda (və ya yuxarıdakı yük balanslaşdırıcıda) bitir.
upstream web { server web:3000; keepalive 16; }
upstream gateway { server gateway:8080; keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 10m;          # Gateway:MaxRequestBodyBytes ilə eyni

    # Sorğu sətri (PHI ola bilər) log-lanmır: $request əvəzinə $uri
    log_format dentacore '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log dentacore;

    location /v1/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;      # müştəri başlığı əzilir, əlavə olunmur
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Tenant "";                       # tenant başlığı xaricdən qəbul edilmir
        proxy_set_header Connection "";
    }

    location /hubs/ {                                       # SignalR: WebSocket + SSE + long polling
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Tenant "";
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}
