apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dentacore.fullname" . }}-config
  labels: {{- include "dentacore.labels" . | nindent 4 }}
data:
  Tenancy__BaseDomain: {{ .Values.tenancy.baseDomain | quote }}
  Tenancy__FixedTenant: {{ .Values.tenancy.fixedTenant | quote }}
  Tenancy__AllowTenantHeader: "false"
  Logging__Format: json
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otlpEndpoint | quote }}
