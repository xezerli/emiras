# postgres_exporter --extend.query-path ilə. Yazı tranzaksiyasının yaşı: backend_xid təyin olunubsa tranzaksiya YAZIR
# (oxuyan tranzaksiya xid almır). Uzun yazı tranzaksiyası pg_snapshot_xmin horizontunu saxlayır → sync pull və Elasticsearch indexer
# geridə qalır, VACUUM təmizləyə bilmir (docs/07 Dilim 7b).
pg_long_running_tx:
  query: |
    SELECT COALESCE(MAX(EXTRACT(EPOCH FROM (now() - xact_start))), 0) AS oldest_write_seconds,
           COUNT(*) FILTER (WHERE state = 'idle in transaction') AS idle_in_tx
    FROM pg_stat_activity
    WHERE backend_xid IS NOT NULL AND pid <> pg_backend_pid()
  metrics:
    - oldest_write_seconds: { usage: GAUGE, description: "Ən köhnə açıq YAZI tranzaksiyasının yaşı (san)" }
    - idle_in_tx: { usage: GAUGE, description: "Yazı edib 'idle in transaction' qalan sessiyalar" }
